# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint for the Spring Boot API and Vite frontend.
services:
  - type: web
    name: flashmob-gre-api
    runtime: docker
    plan: starter
    rootDir: Backend/flashMobGre
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: WORDS_EXCEL_PATH
        value: /var/data/Words.xlsx
      - key: APP_CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: flashmob-gre-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WORD_ADDITION_PASSWORD
        sync: false
    disk:
      name: flashmob-gre-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: flashmob-gre-web
    runtime: static
    rootDir: Frontend/flashmob-gre-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: flashmob-gre-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
