# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint for the Spring Boot API and Vite frontend.
services:
  - type: web
    name: flashmob-gre-api
    runtime: docker
    plan: free
    rootDir: Backend/flashMobGre
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: WORDS_EXCEL_PATH
        value: /tmp/Words.xlsx
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://flashmob-gre-web.onrender.com
      - key: WORD_ADDITION_PASSWORD
        sync: false

  - type: web
    name: flashmob-gre-web
    runtime: static
    rootDir: Frontend/flashmob-gre-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: flashmob-gre-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
